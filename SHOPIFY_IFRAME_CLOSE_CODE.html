<!-- 
  SHOPIFY IFRAME CLOSE HANDLER CODE
  ===================================
  Add this code to your Shopify theme to handle the close message from the chatbot iframe.
  
  Instructions:
  1. Go to Shopify Admin → Online Store → Themes → Actions → Edit code
  2. Open your theme.liquid file (or the file where you added the iframe widget code)
  3. Find the script section where you have the iframe widget code
  4. Add the message listener code below to your existing script
-->

<script>
  // Listen for close message from chatbot iframe
  window.addEventListener('message', function(event) {
    // Security: Verify the origin of your chatbot
    // For local development: if (event.origin !== 'http://localhost:3000') return;
    // For production: if (event.origin !== 'https://your-netlify-url.netlify.app') return;
    if (event.origin !== 'http://localhost:3000') return;
    
    // Check if the message is a close request from the chatbot
    if (event.data && event.data.type === 'CLOSE_CHAT_WIDGET' && event.data.source === 'astroremedis-chat') {
      // Find and close the chat widget
      const chatWindow = document.getElementById('chat-widget-window');
      const chatContainer = document.getElementById('chat-widget-container');
      const backdrop = document.getElementById('chat-widget-backdrop');
      
      if (chatWindow) {
        chatWindow.classList.remove('active');
        chatWindow.style.display = 'none';
      }
      
      if (chatContainer) {
        chatContainer.classList.remove('chat-open');
      }
      
      if (backdrop) {
        backdrop.style.display = 'none';
      }
      
      console.log('✅ Received close message from chatbot - closing widget');
    }
  });
</script>

    z-index: 9998;
    backdrop-filter: blur(4px);

  #chat-widget-container.chat-open .chat-backdrop {

  }

  #chat-widget-button:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
    background: #FF7A4D;
  }

  #chat-widget-button:active {
    transform: scale(0.95);
  }

  #chat-widget-window {
    position: fixed;
    bottom: 50%;
    right: 50%;
    transform: translate(50%, 50%);
    width: 450px;
    height: 700px;

<script>
  // Chat Widget Toggle Functionality
  (function() {
    const chatButton = document.getElementById('chat-widget-button');
    const chatWindow = document.getElementById('chat-widget-window');
    const chatContainer = document.getElementById('chat-widget-container');
    const backdrop = document.getElementById('chat-widget-backdrop');
    const panditChatButton = document.getElementById('pandit-chat-button');
    const panditChatButtonMobile = document.getElementById('pandit-chat-button-mobile');

    function toggleChat() {
      if (chatWindow.classList.contains('active')) {
        closeChat();
      } else {
        openChat();
      }
    }

    function openChat() {
      chatWindow.classList.add('active');
      if (chatContainer) {
        chatContainer.classList.add('chat-open');
      }
    }

    function closeChat() {
      chatWindow.classList.remove('active');
      chatWindow.style.display = 'none';
      if (chatContainer) {
        chatContainer.classList.remove('chat-open');
      }
      if (backdrop) {
        backdrop.style.display = 'none';
      }
    }

    // Listen for close message from iframe
    window.addEventListener('message', function(event) {
      // Security: Verify the origin
      // For local development: if (event.origin !== 'http://localhost:3000') return;
      // For production: if (event.origin !== 'https://your-netlify-url.netlify.app') return;
      if (event.origin !== 'http://localhost:3000') return;
      
      if (event.data && event.data.type === 'CLOSE_CHAT_WIDGET' && event.data.source === 'astroremedis-chat') {
        closeChat();
        console.log('✅ Received close message from iframe - closing widget');
      }
    });

    if (chatButton) {
      chatButton.addEventListener('click', toggleChat);
    }

    // Open chat from navbar button
    if (panditChatButton) {
      panditChatButton.addEventListener('click', function(e) {
        e.preventDefault();
        openChat();
      });
    }

    // Open chat from mobile menu button
    if (panditChatButtonMobile) {
      panditChatButtonMobile.addEventListener('click', function(e) {
        e.preventDefault();
        openChat();
        const menuDrawer = document.getElementById('Details-menu-drawer-container');
        if (menuDrawer && menuDrawer.hasAttribute('open')) {
          menuDrawer.removeAttribute('open');
        }
      });
    }

    // Close chat when clicking on backdrop
    if (backdrop) {
      backdrop.addEventListener('click', function() {
        closeChat();
      });
    }

    // Expose openChat function globally for other scripts
    window.openChatWidget = openChat;
  })();
</script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const chatLinks = document.querySelectorAll('a[href="#open-chatbot"]');
    chatLinks.forEach(function(link) {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        if (window.openChatWidget) {
          window.openChatWidget();
        }
      });
    });
  });
</script>
